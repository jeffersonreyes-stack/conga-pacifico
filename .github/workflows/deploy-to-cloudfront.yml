name: Deploy to AWS S3 & CloudFront

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Next.js project
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://d2ldmbozza14uy.cloudfront.net
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Sync Next.js public files to S3
        run: |
          aws s3 sync ./public s3://${{ secrets.S3_BUCKET_NAME }}/public \
            --cache-control "public, max-age=31536000, immutable" \
            --delete
      
      - name: Sync Next.js build output to S3
        run: |
          aws s3 sync ./.next/static s3://${{ secrets.S3_BUCKET_NAME }}/_next/static \
            --cache-control "public, max-age=31536000, immutable" \
            --delete
      
      - name: Deploy HTML pages to S3
        run: |
          aws s3 sync ./.next/standalone/.next/static s3://${{ secrets.S3_BUCKET_NAME }}/_next/static \
            --cache-control "public, max-age=31536000, immutable" \
            --delete || true
          
          # Upload all HTML files with short cache control
          find .next -name "*.html" -type f | while read file; do
            s3_path="${file#./}"
            aws s3 cp "$file" "s3://${{ secrets.S3_BUCKET_NAME }}/$s3_path" \
              --cache-control "public, max-age=3600" \
              --content-type "text/html"
          done
      
      - name: Sync entire .next/static directory
        run: |
          if [ -d ".next/static" ]; then
            aws s3 sync ./.next/static s3://${{ secrets.S3_BUCKET_NAME }}/_next/static \
              --cache-control "public, max-age=31536000, immutable" \
              --delete
          fi
      
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
      
      - name: Print deployment info
        run: |
          echo "✅ Deployment completed successfully!"
          echo "🌐 Site URL: https://d2ldmbozza14uy.cloudfront.net"
          echo "📦 S3 Bucket: ${{ secrets.S3_BUCKET_NAME }}"
          echo "🔄 CloudFront Distribution: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
