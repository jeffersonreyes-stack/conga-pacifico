name: Deploy to AWS S3 & CloudFront

on:
  push:
    branches:
      - main
      - master
      - conga-landing-page-*

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Next.js project
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://d2ldmbozza14uy.cloudfront.net
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Deploy static site to S3
        run: |
          echo "📤 Syncing files to S3..."
          aws s3 sync ./out s3://${{ secrets.AWS_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=3600"
          echo "✅ Files synced to S3"
      
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_ID }} \
            --paths "/*"
      
      - name: Print deployment info
        run: |
          echo "✅ Deployment completed successfully!"
          echo "🌐 Site URL: https://d2ldmbozza14uy.cloudfront.net"
          echo "📦 S3 Bucket: ${{ secrets.AWS_BUCKET_NAME }}"
          echo "🔄 CloudFront Distribution: ${{ secrets.CLOUDFRONT_ID }}"
