name: Deploy to AWS S3 & CloudFront

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- PASOS NUEVOS OBLIGATORIOS PARA NEXT.JS ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Site
        run: npm run build
      # ------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # NOTA: La infraestructura (Terraform) se debe aplicar manualmente o tener un Backend remoto configurado.
      # Por seguridad, este pipeline solo despliega el CÓDIGO (contenido) al bucket y limpia la caché.

      - name: Sync files to S3 bucket
        # Sincroniza la carpeta 'out' (build de Next.js) con el bucket S3
        run: |
          aws s3 sync out/ s3://${{ secrets.AWS_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront cache
        # Borra la caché para que los cambios se vean inmediatamente
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
