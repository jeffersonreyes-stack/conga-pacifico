name: Deploy to AWS S3 & CloudFront

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- PASOS NUEVOS OBLIGATORIOS PARA NEXT.JS ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Site
        run: npm run build
      # ------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync files to S3 bucket
        # CAMBIO: Usamos 'out/' porque ahí es donde Next.js pone tu página web real
        # CAMBIO: Usamos 'AWS_BUCKET_NAME' que es el secreto que sí tienes
        run: |
          aws s3 sync out/ s3://${{ secrets.AWS_BUCKET_NAME }} --delete

      # ESTE PASO FALLARÁ SI NO TIENES EL SECRETO 'CLOUDFRONT_ID'
      # Si no usas CloudFront todavía, borra estas líneas de abajo:
      # - name: Invalidate CloudFront cache
      #   run: |
      #     aws cloudfront create-invalidation \
      #       --distribution-id ${{ secrets.CLOUDFRONT_ID }} \
      #       --paths "/*"
